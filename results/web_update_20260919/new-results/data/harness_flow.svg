<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">EmoHarness v3 inference and offline construction</title><desc id="flow-desc">A clip supplies visual input, Whisper transcription and openSMILE prosody. The same student extracts visual observations, proposes hypotheses, verifies them and synthesizes an explanation. Deterministic code assembles evidence, validates and ranks hypotheses, and chooses final labels. The offline Builder and its same-model proposal reviewer produce a frozen bundle before evaluation.</desc><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a918e"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box-title{font-size:17px;font-weight:650;fill:#14231e}.box-body{font-size:13px;fill:#4b5d54}.lane{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#66746c}.edge{fill:none;stroke:#8a918e;stroke-width:1.8;marker-end:url(#flow-arrow)}.edge-label{font-size:12px;fill:#53635b}</style><rect width="1000" height="1110" rx="12" fill="#fafbf9"/><text x="30" y="29" class="lane" text-anchor="start">INFERENCE · ONE STUDENT MODEL PER EVALUATION</text><rect x="335" y="48" width="330" height="68" rx="10" fill="#f0f1ee" stroke="#b9c0b7"/><text x="351" y="75" class="box-title" text-anchor="start">Video clip + official question</text><text x="351" y="97" class="box-body" text-anchor="start">Question supplies the task and allowed labels.</text><path d="M 500 116 V 136 H 180 V 155" class="edge"/><path d="M 500 136 V 155" class="edge"/><path d="M 500 136 H 820 V 155" class="edge"/><rect x="30" y="155" width="300" height="84" rx="10" fill="#f4f1e9" stroke="#c5bca4"/><text x="46" y="182" class="box-title" text-anchor="start">Visual preparation · ffmpeg</text><text x="46" y="204" class="box-body" text-anchor="start">Video / sampled frames</text><text x="46" y="222" class="box-body" text-anchor="start">Same declared sampling protocol</text><rect x="350" y="155" width="300" height="84" rx="10" fill="#f4f1e9" stroke="#c5bca4"/><text x="366" y="182" class="box-title" text-anchor="start">Speech text · Whisper large-v3</text><text x="366" y="204" class="box-body" text-anchor="start">Fixed ASR transcription</text><text x="366" y="222" class="box-body" text-anchor="start">No emotion opinion from an analyzer</text><rect x="670" y="155" width="300" height="84" rx="10" fill="#f4f1e9" stroke="#c5bca4"/><text x="686" y="182" class="box-title" text-anchor="start">Prosody · openSMILE</text><text x="686" y="204" class="box-body" text-anchor="start">Acoustic features → cue text</text><text x="686" y="222" class="box-body" text-anchor="start">Fixed code transforms</text><path d="M 180 239 V 262" class="edge"/><rect x="30" y="262" width="300" height="91" rx="10" fill="#eaf3ff" stroke="#95b6df"/><text x="46" y="289" class="box-title" text-anchor="start">① Extract visual evidence</text><text x="46" y="311" class="box-body" text-anchor="start">Student call 1 · extract_visual</text><text x="46" y="329" class="box-body" text-anchor="start">Face, body and scene observations</text><text x="46" y="347" class="box-body" text-anchor="start">Structured JSON; observed cues</text><path d="M 500 239 V 285" class="edge"/><path d="M 820 239 V 253 H 640 V 285" class="edge"/><path d="M 330 308 H 365" class="edge"/><rect x="365" y="285" width="605" height="84" rx="10" fill="#eaf5ef" stroke="#9ebca9"/><text x="381" y="312" class="box-title" text-anchor="start">Assemble evidence record · code</text><text x="381" y="334" class="box-body" text-anchor="start">Visual cue IDs + transcript / prosody cue IDs + task context</text><text x="381" y="352" class="box-body" text-anchor="start">Cached perception is reused. Question text does not count as observed support.</text><path d="M 668 369 V 387 H 180 V 410" class="edge"/><rect x="30" y="410" width="300" height="92" rx="10" fill="#eaf3ff" stroke="#95b6df"/><text x="46" y="437" class="box-title" text-anchor="start">② Propose hypotheses</text><text x="46" y="459" class="box-body" text-anchor="start">Student call 2 · generate_hypotheses</text><text x="46" y="477" class="box-body" text-anchor="start">Candidate labels, confidence, support</text><text x="46" y="495" class="box-body" text-anchor="start">and contradiction IDs</text><path d="M 330 456 H 350" class="edge"/><rect x="350" y="410" width="300" height="92" rx="10" fill="#eaf5ef" stroke="#9ebca9"/><text x="366" y="437" class="box-title" text-anchor="start">Preliminary checks · code</text><text x="366" y="459" class="box-body" text-anchor="start">Validate evidence references</text><text x="366" y="477" class="box-body" text-anchor="start">Rank hypotheses; check cross-modal</text><text x="366" y="495" class="box-body" text-anchor="start">agreement and verification routing</text><path d="M 650 456 H 670" class="edge"/><rect x="670" y="410" width="300" height="92" rx="10" fill="#eaf3ff" stroke="#95b6df"/><text x="686" y="437" class="box-title" text-anchor="start">③ Verify hypotheses</text><text x="686" y="459" class="box-body" text-anchor="start">Student call 3 · verify</text><text x="686" y="477" class="box-body" text-anchor="start">Reconsider competing explanations</text><text x="686" y="495" class="box-body" text-anchor="start">Re-score while preserving alternatives</text><path d="M 820 502 V 540" class="edge"/><rect x="670" y="540" width="300" height="92" rx="10" fill="#eaf5ef" stroke="#9ebca9"/><text x="686" y="567" class="box-title" text-anchor="start">Final verification · code</text><text x="686" y="589" class="box-body" text-anchor="start">Validate revised hypotheses</text><text x="686" y="607" class="box-body" text-anchor="start">Apply bundle ranker and agreement</text><text x="686" y="625" class="box-body" text-anchor="start">checks; retain the resulting order</text><path d="M 670 586 H 650" class="edge"/><rect x="350" y="540" width="300" height="92" rx="10" fill="#eaf3ff" stroke="#95b6df"/><text x="366" y="567" class="box-title" text-anchor="start">④ Synthesize explanation</text><text x="366" y="589" class="box-body" text-anchor="start">Student call 4 · synthesize</text><text x="366" y="607" class="box-body" text-anchor="start">Explain the ranked result</text><text x="366" y="625" class="box-body" text-anchor="start">Ground the explanation in cue IDs</text><path d="M 350 586 H 330" class="edge"/><rect x="30" y="540" width="300" height="92" rx="10" fill="#eaf5ef" stroke="#9ebca9"/><text x="46" y="567" class="box-title" text-anchor="start">Format final answer · code</text><text x="46" y="589" class="box-body" text-anchor="start">Choose labels from validated ranking</text><text x="46" y="607" class="box-body" text-anchor="start">Enforce labels and cardinality</text><text x="46" y="625" class="box-body" text-anchor="start">Attach the grounded explanation</text><text x="30" y="664" class="edge-label" text-anchor="start">Blue = calls to the same student · Green = deterministic code · Sand = fixed preprocessing</text><text x="30" y="686" class="edge-label" text-anchor="start">This evaluated scaffold uses verify_on: always: four nominal calls, with bounded retries.</text><text x="30" y="706" class="edge-label" text-anchor="start">The synthesizer writes the explanation; deterministic code selects the final labels.</text><line x1="30" y1="735" x2="970" y2="735" stroke="#d3dacf" stroke-dasharray="5 5"/><text x="30" y="766" class="lane" text-anchor="start">OFFLINE CONSTRUCTION · FINISHED BEFORE FULL EVALUATION</text><rect x="30" y="789" width="280" height="108" rx="10" fill="#f1edfa" stroke="#b9a8d4"/><text x="46" y="816" class="box-title" text-anchor="start">Builder · GPT-5.6 Luna</text><text x="46" y="838" class="box-body" text-anchor="start">Current bundle + D_build diagnosis</text><text x="46" y="856" class="box-body" text-anchor="start">Full packet: history + correct examples</text><text x="46" y="874" class="box-body" text-anchor="start">Propose prompt / code / config edits</text><path d="M 310 843 H 340" class="edge"/><rect x="340" y="789" width="300" height="108" rx="10" fill="#f1edfa" stroke="#b9a8d4"/><text x="356" y="816" class="box-title" text-anchor="start">Review proposed changes</text><text x="356" y="838" class="box-body" text-anchor="start">Static allowlist + contract probes</text><text x="356" y="856" class="box-body" text-anchor="start">Same-model proposal reviewer</text><text x="356" y="874" class="box-body" text-anchor="start">GPT-5.6 Luna reviews Builder edits</text><path d="M 640 843 H 670" class="edge"/><rect x="670" y="789" width="300" height="108" rx="10" fill="#f1edfa" stroke="#b9a8d4"/><text x="686" y="816" class="box-title" text-anchor="start">Evaluate and promote</text><text x="686" y="838" class="box-body" text-anchor="start">D_build assessment; D_val gates</text><text x="686" y="856" class="box-body" text-anchor="start">Proxy judge only after cheap gates</text><text x="686" y="874" class="box-body" text-anchor="start">Accept a passing candidate or retain parent</text><path d="M 820 897 V 930 H 500 V 955" class="edge"/><rect x="335" y="955" width="330" height="83" rx="10" fill="#f1edfa" stroke="#b9a8d4"/><text x="351" y="982" class="box-title" text-anchor="start">Freeze prompts + code + config</text><text x="351" y="1004" class="box-body" text-anchor="start">Three student-specific builds; 8B reused</text><text x="351" y="1022" class="box-body" text-anchor="start">One frozen final bundle per student</text><path d="M 750 897 V 925 H 170 V 897" class="edge"/><text x="230" y="916" class="edge-label" text-anchor="start">Repeat: updated parent + allowed feedback</text><text x="30" y="1071" class="edge-label" text-anchor="start">The offline proposal reviewer is different from student call ③.</text><text x="30" y="1091" class="edge-label" text-anchor="start">No Builder, proposal-reviewer or proxy-judge calls run during the 16-arm full evaluation.</text></svg>