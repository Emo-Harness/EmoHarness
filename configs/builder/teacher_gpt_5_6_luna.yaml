# Builder / teacher (ADR-0005, ADR-0006). GPT 5.6 Luna over the OpenAI
# chat-completions API; `provider: gemini` selects the alternative client.
# GPT-5 family: `reasoning_effort` is sent and, since it is not `none`, no
# temperature (the API rejects one). Pricing measured 2026-09-08 on the API:
# $0.20 / $1.20 per 1M tokens, 720p frame = 1,117 tokens.
provider: openai
model_id: gpt-5.6-luna
api_key_env: OPENAI_API_KEY
endpoint: ${OPENAI_ENDPOINT:-https://api.openai.com/v1}
temperature: 0.0
reasoning_effort: high
max_candidates_per_round: 4
max_rounds_per_stage: 8
early_stop_rounds: 2
# 20 samples x 4 frames = 80 keyframes per packet (~30k image tokens at 640 px)
packet: {max_failures_per_cluster: 5, max_keyframe_samples: 20, max_frames_per_sample: 4, target_input_tokens: 100000}
# max_mean_calls 4.5: ADR-0011 expects 4 calls per item with one retry per stage
# inside a hard cap of 6; a gate at exactly 4.000 rejects any candidate that ever
# retried (4.005 on D_val rejected every round-0 candidate on 2026-09-08).
gates: {regression_rate_limit: 0.05, reasoning_floor_points: 2.0, gate_sample_size: 200, max_mean_calls: 4.5}
# The verifier is this same model asked, once per round, whether each valid
# candidate is a general reading rule or an overfit, a label prior, or a
# contract break; unapproved candidates are never evaluated (ADR-0006 §8).
verifier: {enabled: true, reasoning_effort: high}
pricing_usd_per_million: {input: 0.2, output: 1.2}
