# Builder / teacher (ADR-0005, ADR-0006). GPT 5.6 Luna over the OpenAI
# chat-completions API; `provider: gemini` selects the alternative client.
provider: openai
model_id: gpt-5.6-luna   # confirm the exact API id before Phase 6
api_key_env: OPENAI_API_KEY
endpoint: ${OPENAI_ENDPOINT:-https://api.openai.com/v1}
temperature: 0.0
max_candidates_per_round: 4
max_rounds_per_stage: 8
early_stop_rounds: 2
packet: {max_failures_per_cluster: 5, max_keyframe_samples: 20, max_frames_per_sample: 10, target_input_tokens: 100000}
gates: {regression_rate_limit: 0.05, reasoning_floor_points: 2.0, gate_sample_size: 200}
pricing_usd_per_million: {input: 2.0, output: 12.0}   # placeholder; confirm before Phase 6
