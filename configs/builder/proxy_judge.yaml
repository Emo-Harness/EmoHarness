# Proxy judge for the Reasoning gate (ADR-0007). This run scores the gate with
# GPT 5.6 Luna over the OpenAI API (no Gemini key on this box); ADR-0007's
# default is Gemini 3 Flash (`provider: gemini`, `model_id: gemini-3-flash`,
# `api_key_env: GEMINI_API_KEY`), a different family from the Builder.
# `reasoning_effort: none` keeps temperature 0 legal on the GPT-5 family.
provider: openai
model_id: gpt-5.6-luna
api_key_env: OPENAI_API_KEY
temperature: 0.0
reasoning_effort: none
frame_interval_seconds: 1.0
max_frames: 10
calibration: {reference_model: gpt-4o-2024-11-20, sample_size: 200, min_agreement: 0.70}
pricing_usd_per_million: {input: 0.2, output: 1.2}
