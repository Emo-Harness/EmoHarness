# Shared preprocessing cache (ADR-0004, ADR-0011).
# This run: no diarization (pyannote.audio does not import against the
# torchaudio on this box; MME clips are single-utterance, so the whole
# transcript is the subject's) and Qwen2.5-Omni-7B as the audio describer
# (ADR-0004's original fallback; the 30B captioner does not fit beside the
# other models in 8 GB of host RAM). Both are recorded in the cache hash.
frames: {fps: 2.0, min_frames: 4, max_frames: 32, judge_fps: 1.0, judge_max_frames: 10}
asr: {model: large-v3, backend: faster_whisper, word_timestamps: true}
prosody: {feature_set: eGeMAPSv02, reference_stats: data/derived/reference_stats.json}
diarization: {backend: none, subject_rule: dominant_by_duration}
describer:
  primary: {model_id: Qwen/Qwen2.5-Omni-7B, mode: audio_only}
  fallback: {model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct, mode: audio_only}
  lexicon_path: configs/emotion_lexicon.txt
cache_root: data/derived
