# Transfer student (2026-09-13 batch). Same serving contract and decoding as the
# Qwen3-VL targets so rows stay comparable; served by vLLM 0.19.1 (torch
# 2.10.0+cu128) because 0.11.2 does not register Qwen3_5ForConditionalGeneration.
model_id: Qwen/Qwen3.5-4B
endpoint: ${VLLM_ENDPOINT:-http://127.0.0.1:8000/v1}
decoding: {temperature: 0.0, top_p: 1.0, seed: 0, max_tokens: 1024}
video: {fps: 2.0, min_frames: 4, max_frames: 32}
call_budget: {expected: 4, hard_cap: 6, retries_per_stage: 1}
# Qwen3.5 reasons by default: with thinking on, 15 of 24 smoke items spent the
# whole 1024-token budget deliberating and never emitted an answer tag, and the
# harness burned its full 6-call cap retrying. The plan calls for thinking
# disabled in this main comparison.
chat_template_kwargs: {enable_thinking: false}
pricing_usd_per_million: {input: 0.0, output: 0.0}   # local serving; GPU time is tracked separately
