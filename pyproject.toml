[tool.poetry]
name = "emoharness"
version = "0.1.0"
description = "EmoHarness: a Builder-constructed inference-time harness for frozen multimodal emotion models"
authors = ["Fenghai Li <maxmeetsli@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "emoharness", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pydantic = "^2.8.2"
pyyaml = "^6.0.1"
numpy = "^1.26.0"
httpx = "^0.27.0"
pillow = "^10.3.0"
imagehash = "^4.3.1"
tqdm = "^4.66.0"

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
openai = "^1.40.0"
google-genai = "^1.0.0"

[tool.poetry.group.audio]
optional = true

[tool.poetry.group.audio.dependencies]
faster-whisper = "^1.0.0"
opensmile = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"
ruff = "^0.3.0"
mypy = "^1.8.0"
types-PyYAML = "^6.0.12"
types-tqdm = "^4.66.0"
commitizen = "^3.14.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.98.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["emoharness"]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --cov=emoharness --cov-report=term-missing"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["emoharness"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise ImportError",
    "except ImportError:",
    "if TYPE_CHECKING:",
]

[tool.codespell]
ignore-words-list = "dout, te, indicies, astroid"
skip = ["data", ".git", "*.pyc", "*.csv", "*.json", "poetry.lock"]
quiet-level = 3

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "S", "N", "SIM", "RET", "ARG"]
ignore = ["E203", "E266", "E501", "S603", "S607"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S311", "ARG001"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
bump_message = "bump: version $current_version → $new_version"
version_files = ["pyproject.toml:version", "src/emoharness/__init__.py:__version__"]
