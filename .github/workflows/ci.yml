name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev,test
      - name: Ruff
        run: |
          poetry run ruff check src tests examples experiments
          poetry run ruff format --check src tests examples experiments
      - name: Mypy
        run: poetry run mypy
      - name: Pytest
        run: poetry run pytest -m 'not integration'
      - name: Codespell
        run: |
          pipx install codespell
          codespell --toml pyproject.toml src tests examples README.md
